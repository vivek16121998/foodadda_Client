<div style="margin-top: 20px;">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-8">
          <div class="card auth">
            <div class="card-body auth-card">
              <div class="auth-avatar text-center mb-3">
                <img src="assets/adress_6724095.png" alt="address" class="user-image">
                <p style="color: white;">Add New Address</p>
              </div>
  
              <form [formGroup]="addAddressForm" (ngSubmit)="add()">
                <!-- Address Name + Address Line 1 in the same row -->
                <div class="row m-4">
                  <div class="form-group col-md-6 text-center">
                    <label for="userAddressName" class="small-label">Address Name</label>
                    <input class="form-control" type="text" id="userAddressName" formControlName="userAddressName">
                    <span class="text-danger" *ngIf="addAddressForm.get('userAddressName')?.invalid && addAddressForm.get('userAddressName')?.dirty">
                      Address Name is Required
                    </span>
                  </div>
                  <div class="form-group col-md-6 text-center">
                    <label for="addressLine1" class="small-label">Address Line 1</label>
                    <input class="form-control" type="text" id="addressLine1" formControlName="addressLine1">
                    <span class="text-danger" *ngIf="addAddressForm.get('addressLine1')?.invalid && addAddressForm.get('addressLine1')?.dirty">
                      Address Line 1 is Required
                    </span>
                  </div>
                </div>
  
                <!-- Address Line 2 + Area in the same row -->
                <div class="row m-4">
                  <div class="form-group col-md-6 text-center">
                    <label for="addressLine2" class="small-label">Address Line 2</label>
                    <input class="form-control" type="text" id="addressLine2" formControlName="addressLine2">
                    <span class="text-danger" *ngIf="addAddressForm.get('addressLine2')?.invalid && addAddressForm.get('addressLine2')?.dirty">
                      Address Line 2 is Required
                    </span>
                  </div>
                  <div class="form-group col-md-6 text-center">
                    <label for="area" class="small-label">Area</label>
                    <input class="form-control" type="text" id="area" formControlName="area">
                    <span class="text-danger" *ngIf="addAddressForm.get('area')?.invalid && addAddressForm.get('area')?.dirty">
                      Only alphabets are allowed
                    </span>
                  </div>
                </div>
  
                <!-- City + State in the same row -->
                <div class="row m-4 justify-content-center">
                  <div class="form-group col-md-6 text-center">
                    <label for="city" class="small-label">City</label>
                    <input class="form-control" type="text" id="city" formControlName="city">
                    <span class="text-danger" *ngIf="addAddressForm.get('city')?.invalid && addAddressForm.get('city')?.dirty">
                      Only alphabets are allowed
                    </span>
                  </div>
                  <div class="form-group col-md-6 text-center">
                    <label for="userState" class="small-label">State</label>
                    <select id="userState" class="form-control" formControlName="userState">
                      <option value="">--Select--</option>
                      <option *ngFor="let r of stateList" [value]="r">{{ r }}</option>
                    </select>
                    <span class="text-danger" *ngIf="addAddressForm.get('userState')?.invalid && addAddressForm.get('userState')?.dirty">
                      State is Required
                    </span>
                  </div>
                </div>
  
                <!-- Pincode in the center -->
                <div class="row m-4 justify-content-center">
                  <div class="form-group col-md-4 text-center">
                    <label for="pincode" class="small-label">Pincode</label>
                    <input class="form-control" type="number" id="pincode" formControlName="pincode">
                    <span class="text-danger" *ngIf="addAddressForm.get('pincode')?.invalid && addAddressForm.get('pincode')?.dirty">
                      Only numbers are allowed
                    </span>
                  </div>
                </div>
  
                <!-- Submit Button -->
                <div class="text-center mt-4">
                  <button type="submit" class="btn btn-block"
                          [ngClass]="{
                            'btn-success': addAddressForm.valid,
                            'btn-primary': addAddressForm.invalid
                          }" 
                          [disabled]="addAddressForm.invalid">
                    Add
                  </button>
                </div>
              </form>
  
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
