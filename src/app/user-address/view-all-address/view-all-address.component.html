<div class="text-center my-4">
    <button class="btn btn-success" (click)="addAddress()">
        <i class="bi bi-plus-circle"></i> Add New Address
    </button>
</div>
<div *ngIf="errorMessage" class="text-center my-5">
    <div class="text-white fs-4 mb-3">{{errorMessage}}</div>
</div>

<div class="container my-5" *ngIf="userAddressList.length > 0">

    <div class="d-flex justify-content-between align-items-center mb-3" >
        <div class="d-flex justify-content-start">
            <!-- Pagination Controls (Left Side) -->
            <pagination-controls style="background-color: aliceblue;" (pageChange)="currentPage = $event" class="d-flex justify-content-start mt-3"></pagination-controls>
        </div>
    
        <!-- Page Size Selector (Right Side) -->
        <div class="d-flex justify-content-end" style="margin: 10px;">
            <table style="background-color: aliceblue;">
                <tbody>
                    <tr>
                        <td>
                            <label for="pageSize" class="me-2" style="display: flex; justify-content: center;">Items per page</label>
                        </td>
                        <td> : </td>
                        <td>
                            <select id="pageSize" class="form-select w-auto" [(ngModel)]="pageSize" (change)="currentPage = 1">
                                <option value="5">5</option>
                                <option value="10">10</option>
                                <option value="15">15</option>
                            </select>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Address Table -->
    <div class="table-responsive shadow-sm rounded border p-3">
        <table class="table table-striped table-bordered align-middle text-center mb-0">
            <thead class="table-dark">
                <tr>
                    <!-- Hardcoded column names -->
                    <th>Address Name</th>
                    <th>Address</th>
                    <th>Area</th>
                    <th>City</th>
                    <th>State</th>
                    <th>Pincode</th>
                    <th>Actions</th> <!-- Action column for Edit/Delete -->
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let address of userAddressList | paginate: { itemsPerPage: pageSize, currentPage: currentPage }">
                    <!-- Address Data -->
                    <td>{{ address.userAddressName }}</td>
                    <td>{{ address.addressLine1 + ', ' + address.addressLine2 }}</td> <!-- Combined Address Lines -->
                    <td>{{ address.area }}</td>
                    <td>{{ address.city }}</td>
                    <td>{{ address.userState }}</td>
                    <td>{{ address.pincode }}</td>
                    <td>
                        <!-- Edit and Delete icons with Material Icons and Tooltips -->
                        <i class="material-icons text-primary mr-3" matTooltip="Edit" (click)="updateAddress(address)">
                            edit
                        </i>
                        <i class="material-icons text-danger" matTooltip="Remove" (click)="deleteAddress(address.userAddressId)">
                            delete
                        </i>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
